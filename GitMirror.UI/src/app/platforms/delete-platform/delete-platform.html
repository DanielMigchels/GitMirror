<app-generic-off-canvas-drawer #drawer title="Delete platform">
  <div class="flex flex-col gap-4">
    <div>
      Are you sure you want to delete the platform <span class="font-bold">{{platform?.username}}</span>?
    </div>
    <div class="font-bold text-error">
      This cannot be undone.
    </div>
    <div class="flex justify-between items-center">
      <label class="py-2 cursor-pointer flex items-center gap-2">
        <input type="checkbox" [(ngModel)]="isChecked" class="cursor-pointer">
        <span>I am sure</span>
      </label>
      <div class="flex justify-end" *ngIf="isChecked">
        <button *ngIf="!isSubmitting" (click)="deletePlatform()" class="shadow rounded py-2 px-4 bg-error hover:bg-error/90 text-white cursor-pointer">
          Delete
        </button>
        <app-loader *ngIf="isSubmitting"></app-loader>
      </div>
    </div>
  </div>
</app-generic-off-canvas-drawer>
