<div *ngIf="totalItems > 0" class="w-full">
  <div class="overflow-x-auto rounded border border-text/20">
    <table class="min-w-full divide-y divide-text/20">
      <thead class="bg-text/5">
        <tr>
          <th *ngFor="let column of columns"
            class="px-6 py-3 text-left text-xs font-medium text-text/70 uppercase tracking-wider"
            [innerHTML]="column.elementRef.nativeElement.innerHTML"></th>
        </tr>
      </thead>
      <tbody class="bg-background divide-y divide-text/10">
        <tr *ngFor="let row of rows" class="hover:bg-text/5 transition-colors">
          <td *ngFor="let cell of row.cells" class="px-6 py-4 text-sm text-text"
            [innerHTML]="cell.elementRef.nativeElement.innerHTML"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="data" class="mt-4 flex items-center justify-between">
    <div class="text-sm text-text/60">
      Page {{ data.page }} | {{ totalItems }} items
    </div>
    <div class="flex gap-2">
      <button (click)="onPrevious()" [disabled]="!data.hasPrevious"
        class="px-4 py-2 text-sm font-medium rounded border border-text/20 transition-colors"
        [ngClass]="{'bg-primary text-white hover:bg-primary/80 cursor-pointer': data.hasPrevious,'bg-text/5 text-text/40 cursor-not-allowed': !data.hasPrevious}">
        Previous
      </button>
      <button (click)="onNext()" [disabled]="!data.hasNext"
        class="px-4 py-2 text-sm font-medium rounded border border-text/20 transition-colors"
        [ngClass]="{ 'bg-primary text-white hover:bg-primary/80 cursor-pointer': data.hasNext, 'bg-text/5 text-text/40 cursor-not-allowed': !data.hasNext }">
        Next
      </button>
    </div>
  </div>
</div>

<div *ngIf="totalItems === 0" class="text-center py-8 text-text/60">
  <p>No data available</p>
</div>

<div style="display: none;">
  <ng-content></ng-content>
</div>
