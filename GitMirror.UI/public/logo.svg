<svg
  width="400"
  height="400"
  viewBox="0 0 400 400"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
>
  <!-- Background -->
  <rect width="400" height="400" rx="48" fill="#F05032"/>

  <!-- Back (copied) diamond -->
  <g transform="translate(200 200) rotate(45)">
    <rect
      x="-92"
      y="-92"
      width="184"
      height="184"
      rx="14"
      fill="rgba(255,255,255,0.35)"
    />
  </g>

  <!-- Front diamond -->
  <g transform="translate(200 200) rotate(45) translate(-18 -18)">
    <rect
      x="-92"
      y="-92"
      width="184"
      height="184"
      rx="14"
      fill="#FFFFFF"
    />
  </g>

  <!-- Wave cut (single strong mark) -->
  <path
    d="M 110 140
       C 160 110, 240 110, 290 140"
    fill="none"
    stroke="#F05032"
    stroke-width="16"
    stroke-linecap="round"
  />
</svg>
